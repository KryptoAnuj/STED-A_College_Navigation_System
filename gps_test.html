
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus GPS Test</title>
</head>
<body>
    <h2>College Navigation - GPS Test</h2>

    <p id="status">Waiting for GPS permission...</p>
    <p id="latitude">Latitude: --</p>
    <p id="longitude">Longitude: --</p>
    <p id="accuracy">Accuracy: --</p>

    <button onclick="startGPS()">Start GPS</button>
    <button onclick="stopGPS()">Stop GPS</button>

    <script>
        let watchID = null;

        function startGPS() {
            if (!navigator.geolocation) {
                document.getElementById("status").textContent =
                    "Geolocation is not supported by this browser.";
                return;
            }

            document.getElementById("status").textContent =
                "Requesting location...";

            watchID = navigator.geolocation.watchPosition(
                function (position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    document.getElementById("status").textContent =
                        "GPS location received.";

                    document.getElementById("latitude").textContent =
                        "Latitude: " + lat;

                    document.getElementById("longitude").textContent =
                        "Longitude: " + lon;

                    document.getElementById("accuracy").textContent =
                        "Accuracy: approximately " + accuracy + " metres";
                },

                function (error) {
                    document.getElementById("status").textContent =
                        "GPS error: " + error.message;
                },

                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 15000
                }
            );
        }

        function stopGPS() {
            if (watchID !== null) {
                navigator.geolocation.clearWatch(watchID);
                watchID = null;
                document.getElementById("status").textContent =
                    "GPS tracking stopped.";
            }
        }
    </script>
</body>
</html>
